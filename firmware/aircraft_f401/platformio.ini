[platformio]
default_envs = blackpill_f401ce

[env:blackpill_f401ce]
platform = ststm32
board = blackpill_f401ce
framework = arduino
monitor_speed = 115200
extra_scripts = pre:../common/spi_fix.py
lib_deps =
    nrf24/RF24@1.4.11
    asukiaaa/MPU9250_asukiaaa@^1.5.13
    adafruit/Adafruit BMP280 Library@^3.0.0
build_flags =
    -D ESC_MIN_US=750
    -D ESC_MAX_US=2000
    -D OPEN_DRAIN_OUTPUTS=1

; The previous receiver setup recorded 750 us as the idle pulse for its ESC.
; Verify this value with the propeller removed before connecting the motor.
; PB6/PB7/PB8 use external 5 V pull-ups and must stay open-drain.

[env:bench_usb]
extends = env:blackpill_f401ce
build_flags =
    ${env:blackpill_f401ce.build_flags}
    -D USB_DIAGNOSTIC=1
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED

[env:bench_usb_stlink]
extends = env:bench_usb
upload_protocol = stlink
debug_tool = stlink

[env:bench_usb_radio]
extends = env:bench_usb_stlink
build_flags =
    ${env:bench_usb.build_flags}
    -D RADIO_DIAGNOSTIC=1

[env:bench_usb_dfu]
extends = env:bench_usb
upload_protocol = dfu
