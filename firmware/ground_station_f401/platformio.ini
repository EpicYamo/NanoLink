[platformio]
default_envs = blackpill_f401ce_usb

[env:blackpill_f401ce_usb]
platform = ststm32
board = blackpill_f401ce
framework = arduino
monitor_speed = 115200
extra_scripts = pre:../common/spi_fix.py
lib_deps =
    nrf24/RF24@1.4.11
    olikraus/U8g2@^2.36.18
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED

[env:oled_test]
extends = env:blackpill_f401ce_usb
build_flags =
    ${env:blackpill_f401ce_usb.build_flags}
    -D OLED_DIAGNOSTIC=1

[env:radio_test]
extends = env:blackpill_f401ce_usb
build_flags =
    ${env:blackpill_f401ce_usb.build_flags}
    -D RADIO_DIAGNOSTIC=1

[env:radio_test_f411]
extends = env:blackpill_f401ce_usb
board = blackpill_f411ce
build_flags =
    ${env:blackpill_f401ce_usb.build_flags}
    -D RADIO_DIAGNOSTIC=1
