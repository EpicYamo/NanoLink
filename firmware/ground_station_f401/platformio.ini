[platformio]
default_envs = blackpill_f401ce_usb

[env:blackpill_f401ce_usb]
platform = ststm32
board = blackpill_f401ce
framework = arduino
monitor_speed = 115200
lib_deps =
    nrf24/RF24@^1.4.11
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED
